services:

  nopcommerce:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: nopcommerce-app

    ports:
      - "8081:80"

    depends_on:
      - mssql

    environment:
      DB_SERVER: mssql
      DB_NAME: nopcommerce
      DB_USER: sa
      DB_PASSWORD: YourStrong@Pass123

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: nopcommerce-db

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Pass123"

    ports:
      - "1433:1433"
